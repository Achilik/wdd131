<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
    <link rel="stylesheet" href="styles/styles.css">
    <script defer src="scripts/products.js"></script>
</head>
<body>

<header>
    <h1>Product Review</h1>
</header>

<main>
    <form method="get" action="review.html" class="review-form">

        <!-- Product Name -->
        <label for="product">Product Name</label>
        <select id="product" name="product" required>
            <option value="" disabled selected>Select a Product ...</option>
            <!-- JS inserts options here -->
        </select>

        <!-- Rating -->
        <fieldset class="rating-group">
            <legend>Overall Rating</legend>
            <label><input type="radio" name="rating" value="1" required> ★</label>
            <label><input type="radio" name="rating" value="2"> ★★</label>
            <label><input type="radio" name="rating" value="3"> ★★★</label>
            <label><input type="radio" name="rating" value="4"> ★★★★</label>
            <label><input type="radio" name="rating" value="5"> ★★★★★</label>
        </fieldset>

        <!-- Date Installed -->
        <label for="install">Date of Installation</label>
        <input type="date" id="install" name="install" required>

        <!-- Useful Features -->
        <fieldset class="features-group">
            <legend>Which features did you find useful? (Check all that apply)</legend>

            <label><input type="checkbox" name="features" value="Durability"> Durability</label>
            <label><input type="checkbox" name="features" value="Ease of Use"> Ease of Use</label>
            <label><input type="checkbox" name="features" value="Performance"> Performance</label>
            <label><input type="checkbox" name="features" value="Design"> Design</label>
        </fieldset>

        <!-- Written Review -->
        <label for="review">Written Review (Optional)</label>
        <textarea id="review" name="review" rows="5"></textarea>

        <!-- User Name -->
        <label for="username">Your Name (Optional)</label>
        <input type="text" id="username" name="username">

        <!-- Submit -->
        <input type="submit" value="Post Review" class="submit-btn">

    </form>
</main>

<footer>
    <p>©2025 <span id="currentyear"></span> Achilike Samuel Nwaokonko</p>
        <p>Last Modified: <span id="lastmodified"></span></p>
</footer>

</body>
</html>
