<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product Review Form</title>
  
  <!-- Required meta tags -->
  <meta name="description" content="Submit product reviews for solar and home products. Mobile-first form with star rating, feature checklist, and confirmation counter.">
  <meta name="author" content="Achilike Samuel Nwaokonko">

  <link rel="stylesheet" href="styles/styles.css">
  <script defer src="scripts/products.js"></script>
</head>


<body>

<header>
    <h1>Product Review</h1>
</header>

<main>
    <form method="get" action="review.html" class="review-form">

        <!-- Product Name -->
        <label for="product">Product Name</label>
        <select id="product" name="product" required>
            <option value="" disabled selected>Select a Product ...</option>
            <!-- JS inserts options here -->
        </select>

        <!-- Rating -->
      <fieldset class="rating-field">
    <legend>Overall Rating</legend>

    <input type="radio" id="rating1" name="rating" value="1" required>
    <label for="rating1">★</label>

    <input type="radio" id="rating2" name="rating" value="2" required>
    <label for="rating2">★★</label>

    <input type="radio" id="rating3" name="rating" value="3" required>
    <label for="rating3">★★★</label>

    <input type="radio" id="rating4" name="rating" value="4" required>
    <label for="rating4">★★★★</label>

    <input type="radio" id="rating5" name="rating" value="5" required>
    <label for="rating5">★★★★★</label>
</fieldset>




        <!-- Date Installed -->
        <label for="install">Date of Installation</label>
        <input type="date" id="install" name="install" required>

        <!-- Useful Features -->
        <fieldset class="features-field">
    <legend>Useful Features (Check all that apply)</legend>

    <div>
        <input type="checkbox" id="feature1" name="features" value="Durability">
        <label for="feature1">Durability</label>
    </div>

    <div>
        <input type="checkbox" id="feature2" name="features" value="Ease of Use">
        <label for="feature2">Ease of Use</label>
    </div>

    <div>
        <input type="checkbox" id="feature3" name="features" value="Performance">
        <label for="feature3">Performance</label>
    </div>

    <div>
        <input type="checkbox" id="feature4" name="features" value="Design">
        <label for="feature4">Design</label>
    </div>
</fieldset>


        <!-- Written Review -->
        <label for="review">Written Review (Optional)</label>
        <textarea id="review" name="review" rows="5"></textarea>

        <!-- User Name -->
        <label for="username">Your Name (Optional)</label>
        <input type="text" id="username" name="username">

        <!-- Submit -->
        <input type="submit" value="Post Review" class="submit-btn">

    </form>
</main>

<footer>
    <p>©2025 <span id="currentyear"></span> Achilike Samuel Nwaokonko</p>
        <p>Last Modified: <span id="lastmodified"></span></p>
</footer>

</body>
</html>
